<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio JS</title>
  </head>
    <body class="bg-bg text-white font-mono antialiased overflow-x-hidden">

      <!-- ═══════════════════════════════════════════════ HEADER / NAVBAR -->
      <header class="fixed top-0 left-0 right-0 z-40 bg-bg/80 backdrop-blur border-b border-card">
        <nav class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
      
          <!-- Logo -->
          <a href="#" class="flex items-center gap-2 font-display font-bold text-white text-lg tracking-tight">
            <span class="w-7 h-7 rounded-md bg-neon flex items-center justify-center text-bg text-xs font-black">G2</span>
            Groupe 2
          </a>
      
          <!-- Links -->
          <ul class="hidden md:flex items-center gap-8 text-sm text-gray-400">
            <li><a href="#hero"     class="hover:text-neon transition-colors">Accueil</a></li>
            <li><a href="#apropos"  class="hover:text-neon transition-colors">A propos</a></li>
            <li><a href="#experience" class="hover:text-neon transition-colors">Experience</a></li>
            <li><a href="#projets"  class="hover:text-neon transition-colors">Portfolio</a></li>
            <li><a href="#contact"  class="hover:text-neon transition-colors">Contact</a></li>
          </ul>
      
          <!-- CTA -->
          <a href="#contact"
            class="hidden md:inline-flex items-center gap-2 border border-neon text-neon text-sm font-mono px-4 py-2 rounded-full hover:bg-neon hover:text-bg transition-all duration-200">
            Recruter maintenant
          </a>
      
          <!-- Mobile burger -->
          <button id="btnMenu" class="md:hidden text-neon" aria-label="Menu">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </nav>
      
        <!-- Mobile menu -->
        <div id="mobileMenu" class="hidden md:hidden px-6 pb-4 flex flex-col gap-4 text-sm text-gray-300">
          <a href="#hero"       class="hover:text-neon">Accueil</a>
          <a href="#apropos"    class="hover:text-neon">A propos</a>
          <a href="#experience" class="hover:text-neon">Experience</a>
          <a href="#projets"    class="hover:text-neon">Portfolio</a>
          <a href="#contact"    class="hover:text-neon">Contact</a>
        </div>
      </header>

      <main>
        <!-- ══════════════════════════════ PROJETS -->
        <section id="projets" class="py-24 px-6 max-w-7xl mx-auto">
          <p class="section-label mb-3">Portfolio</p>
          <div class="flex items-end justify-between mb-10">
            <h2 class="text-white font-display font-extrabold text-3xl">Mes Projets</h2>
            <span id="compteurProjets" class="text-xs font-mono text-muted"></span>
          </div>

          <section id="conteneur-projets"
                  class="flex-conteneur grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- cartes injectées par JS — chaque carte affiche : image + libellé + bouton Supprimer -->
          </section>
        </section>


        <!-- ══════════════════════════════ FORMULAIRE AJOUT PROJET -->
        <section id="section-formulaire" class="py-16 px-6 max-w-2xl mx-auto">
          <div class="bg-surface border border-card rounded-2xl p-8">
            <p class="section-label mb-2">Nouveau</p>
            <h2 class="text-white font-display font-bold text-2xl mb-6">Ajouter un projet</h2>

            <form id="formulaireProjet" class="flex flex-col gap-4">

              <!-- Libellé -->
              <div class="flex items-center gap-4">
                <label for="libelle"
                      class="w-28 shrink-0 text-xs font-mono text-muted uppercase tracking-widest">
                  Libellé *
                </label>
                <input type="text" id="libelle" placeholder="Nom du projet"
                      required class="flex-1"/>
              </div>

              <!-- Description -->
              <div class="flex items-start gap-4">
                <label for="description"
                      class="w-28 shrink-0 text-xs font-mono text-muted uppercase tracking-widest pt-2">
                  Description
                </label>
                <textarea id="description" rows="3"
                          placeholder="Décription du projet"
                          class="flex-1 resize-y"></textarea>
              </div>

              <!-- Zone upload image -->
              <div class="flex items-start gap-4">
                <label class="w-28 shrink-0 text-xs font-mono text-muted uppercase tracking-widest pt-3">
                  Image
                </label>
                <div id="dropZone"
                    class="drop-zone flex-1 border-dashed border-2 border-muted rounded-xl
                            p-5 flex flex-col items-center gap-2 cursor-pointer
                            hover:border-neon transition-colors duration-200"
                    onclick="document.getElementById('imageFile').click()">
                  <svg xmlns="http://www.w3.org/2000/svg"
                      class="w-7 h-7 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                          d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4
                            M17 8l-5-5-5 5M12 3v12"/>
                  </svg>
                  <p class="text-xs font-mono text-muted text-center leading-relaxed">
                    <span class="text-neon">Choisir un fichier</span>
                  </p>
                  <img id="previewImg" alt="aperçu"
                      class="hidden w-16 h-16 object-cover rounded-lg mt-1"/>
                </div>
                <input type="file" id="imageFile" accept="image/*" class="hidden"/>
              </div>

              <!-- Grille 2 colonnes — décalée sous le label -->
              <div class="flex items-start gap-4">
                <div class="w-28 shrink-0"></div><!-- spacer aligné sur les labels -->
                <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-4">

                  <div class="flex flex-col gap-1">
                    <label for="technologies"
                          class="text-xs font-mono text-muted uppercase tracking-widest">
                      Technologies <span class="normal-case">(séparé par virgule)</span>
                    </label>
                    <input type="text" id="technologies" placeholder="React, Node.js…" class="w-full"/>
                  </div>

                  <div class="flex flex-col gap-1">
                    <label for="githubUrl"
                          class="text-xs font-mono text-muted uppercase tracking-widest">
                      Lien GitHub
                    </label>
                    <input type="url" id="githubUrl" placeholder="https://github.com/…" class="w-full "/>
                  </div>

                  <div class="flex flex-col gap-1">
                    <label for="demoUrl"
                          class="text-xs font-mono text-muted uppercase tracking-widest">
                      URL démo
                    </label>
                    <input type="url" id="demoUrl" placeholder="https://…" class="w-full"/>
                  </div>

                  <div class="flex flex-col gap-1">
                    <label for="statut"
                          class="text-xs font-mono text-muted uppercase tracking-widest">
                      Statut
                    </label>
                    <select id="statut" class="w-full">
                      <option value="en_cours">En cours</option>
                      <option value="termine">Terminé</option>
                      <option value="archive">Archivé</option>
                    </select>
                  </div>

                </div>
              </div>

              <button type="submit"
                      class="w-full bg-neon text-bg font-display font-bold py-3 rounded-full
                            hover:shadow-neon transition-all duration-300 text-sm mt-2">
                + Ajouter le projet
              </button>

            </form>
          </div>
        </section>


        <!-- ══════════════════════════════ ZONE DÉTAIL (cachée par défaut) -->
        <section id="section-detail" style="display:none">
          <div class="bg-surface border border-card rounded-2xl w-full max-w-lg p-8 relative mx-4">

            <button id="btnFermerDetail"
                    class="absolute top-4 right-4 text-muted hover:text-neon transition-colors text-xl font-mono">
              ✕
            </button>

            <div id="detail-contenu" class="font-mono text-sm text-gray-300"></div>
            <!--
              Contenu injecté par detaillerProjet() :
              - image du projet
              - #id  +  libellé  +  statut  +  liens
              - description
              - technologies : sous-liste ordonnée <ol>
            -->
          </div>
        </section>      
      </main>



    <script type="module" src="./src/main.js"></script>
  </body>
</html>
